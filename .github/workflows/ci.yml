name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # ubuntu-latest 自带 Android SDK（license 已收）；
      # 缺失的平台包由 AGP 经 sdkmanager 自动下载
      - uses: gradle/actions/setup-gradle@v4

      # 门禁与 AGENTS.md 一致；仓库配置了 configuration-cache，
      # 因历史兼容问题统一关闭
      - name: ktlint + 单测 + debug 构建
        run: ./gradlew ktlintCheck test assembleDebug --no-configuration-cache

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dakala-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
