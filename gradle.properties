# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableAapt2Daemon=false
android.suppressUnsupportedOptionWarnings=android.aapt2FromMavenOverride,android.suppressUnsupportedOptionWarnings
# material3 1.5 要求 compileSdk>=37；AGP 9.1.1 实测最高 37.0，37.2 经此开关显式启用
android.suppressUnsupportedCompileSdk=37.2

# Kotlin settings
kotlin.code.style=official

# JVM Toolchain settings
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
